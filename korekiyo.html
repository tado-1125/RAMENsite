<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>コレキヨ</title>
        <link rel="stylesheet" href="css/acces.css">
        <script src="https://kit.fontawesome.com/5154172c77.js" crossorigin="anonymous"></script>
        <link rel="icon" href="image/tochigi.png" type="image/png">
    </head>
    <body>
        <div class="wrapper">
            <main class="main_contents">
                <section class="items">
                    <div class="item"><!--Flexコンテナ-->
                        <div class="item_img"><!--Flexアイテム：画像-->
                            <img src="image/korekiyostore.jpg" alt="外観写真">
                        </div>
                        <div class="item_text"><!--Flexアイテム：文字-->
                            <h2>コレキヨ</h2>
                            <div class="it"><i class="far fa-clock"></i> 月・火・水・金・土・日　　11:30～14:00　　18:00～20:30</div>
                            <p>■定休日　　木</p>
                            <div class="it"><i class="fas fa-train"></i> JR宇都宮駅</div>
                            <div class="it"><i class="fas fa-map-marker-alt"></i>JR宇都宮駅から徒歩3分</div>
                            <div class="it"><i class="fa-solid fa-map"></i>		
                                栃木県宇都宮市東宿郷2-5-17</div>                                                        
                        </div>
                    </div>
                    <div class="item"><!--Flexコンテナ-->
                        <div class="item_img"><!--Flexアイテム：画像-->
                            <img src="image/korekiyo.jpg" alt="ラーメン(豚骨)">
                        </div>
                        <div class="item_text"><!--Flexアイテム：文字-->
                            <h2>おすすめの1品</h2>
                            <p>鶏中華そば</p>
                        </div>
                    </div>   
                </section>
            </main>
            <main class="access">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3204.8421016919197!2d139.899807909689!3d36.55791997220168!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601f677163ebcacb%3A0xe7aa6f6cc03339a6!2z44Kz44Os44Kt44Oo!5e0!3m2!1sja!2sjp!4v1741015087336!5m2!1sja!2sjp" width="960" height="500" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </main>            
        </div>
    </body>
</html>
