<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>村岡屋</title>
        <link rel="stylesheet" href="css/acces.css">
        <script src="https://kit.fontawesome.com/5154172c77.js" crossorigin="anonymous"></script>
        <link rel="icon" href="image/tochigi.png" type="image/png">
    </head>
    <body>
        <div class="wrapper">
            <main class="main_contents">
                <section class="items">
                    <div class="item"><!--Flexコンテナ-->
                        <div class="item_img"><!--Flexアイテム：画像-->
                            <img src="image/muraokayastore.jpg" alt="外観写真">
                        </div>
                        <div class="item_text"><!--Flexアイテム：文字-->
                            <h2>村岡屋</h2>
                            <div class="it"><i class="far fa-clock"></i> 火・水・木・金・土・日　　11:15～14:30　　17:30～20:45</div>
                            <p>■定休日　　月</p>
                            <div class="it"><i class="fas fa-train"></i> 東武宇都宮駅</div>
                            <div class="it"><i class="fas fa-map-marker-alt"></i>	
                                東武宇都宮駅から徒歩10分。</div>
                            <div class="it"><i class="fa-solid fa-map"></i>		
                                栃木県宇都宮市西原1-6-2</div>                                                        
                        </div>
                    </div>
                    <div class="item"><!--Flexコンテナ-->
                        <div class="item_img"><!--Flexアイテム：画像-->
                            <img src="image/muraokaya.jpg" alt="ラーメン(豚骨)">
                        </div>
                        <div class="item_text"><!--Flexアイテム：文字-->
                            <h2>おすすめの1品</h2>
                            <p>特製つけ麺</p>
                        </div>
                    </div>   
                </section>
            </main>
            <main class="access">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3204.918057485073!2d139.8686538096888!3d36.55608867220222!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601f67ef5aed7c73%3A0x4ff1af256c944323!2z5p2R5bKh5bGLIOacrOW6lw!5e0!3m2!1sja!2sjp!4v1741092774196!5m2!1sja!2sjp" width="960" height="500" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </main>            
        </div>
