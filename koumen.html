<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>幸麺</title>
        <link rel="stylesheet" href="css/acces.css">
        <script src="https://kit.fontawesome.com/5154172c77.js" crossorigin="anonymous"></script>
        <link rel="icon" href="image/tochigi.png" type="image/png">
    </head>
    <body>
        <div class="wrapper">
            <main class="main_contents">
                <section class="items">

                    <div class="item"><!--Flexコンテナ-->
                        <div class="item_img"><!--Flexアイテム：画像-->
                            <img src="image/koumenstore.jpg" alt="外観写真">
                        </div>
                        <div class="item_text"><!--Flexアイテム：文字-->
                            <h2>幸麺</h2>
                            <div class="it"><i class="far fa-clock"></i> 水・木・金・土・日・祝日　　11:00 ～15:00　　17:00～21:00</div>
                            <p>■定休日　　月・火</p>
                            <div class="it"><i class="fas fa-train"></i> JR宇都宮駅</div>
                            <div class="it"><i class="fas fa-map-marker-alt"></i>JR宇都宮駅西口からバス5分、「県庁前」下車、徒歩8分。</div>
                            <div class="it"><i class="fa-solid fa-map"></i>	
                                栃木県宇都宮市戸祭元町4-5</div>
                            
                            
                        </div>
                    </div>
                    <div class="item"><!--Flexコンテナ-->
                        <div class="item_img"><!--Flexアイテム：画像-->
                            <img src="image/koumen.jpg" alt="ラーメン(醤油)">
                        </div>
                        <div class="item_text"><!--Flexアイテム：文字-->
                            <h2>おすすめの1品</h2>
                            <p>味噌ラーメン</p>
                        </div>
                    </div>   

                </section>
            </main>
            <main class="access">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4531.606012439359!2d139.87558384177!3d36.57028060593844!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601f67b3905d90c7%3A0x53199612a735fd80!2z5bm46bq6!5e0!3m2!1sja!2sjp!4v1740962242837!5m2!1sja!2sjp" width="960" height="500" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </main>
            
        </div>
